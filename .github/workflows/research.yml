name: Daily research

on:
  schedule:
    - cron: "17 03 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_DAILY_RESEARCH == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL || 'openai/gpt-oss-120b' }}
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      TAVILY_API_KEY: ${{ secrets.TAVILY_API_KEY }}
      ABSURDITY_MODE: live
      RESEARCH_WINDOW_HOURS: ${{ vars.RESEARCH_WINDOW_HOURS || '30' }}
      RESEARCH_MAX_CANDIDATES: ${{ vars.RESEARCH_MAX_CANDIDATES || '12' }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install
        run: npm install

      - name: Require persistent database
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL secret is required for scheduled research."
            exit 1
          fi

      - name: Run daily research pipeline
        run: npm run research:daily
