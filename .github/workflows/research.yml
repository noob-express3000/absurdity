name: Daily research

on:
  schedule:
    - cron: "17 03 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    # Scheduled research is on by default. Set ENABLE_DAILY_RESEARCH=false as
    # an emergency quota kill switch; manual dispatch always remains available.
    if: ${{ github.event_name == 'workflow_dispatch' || vars.ENABLE_DAILY_RESEARCH != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ABSURDITY_URL: ${{ vars.ABSURDITY_URL || 'https://absurdity.onrender.com' }}

    steps:
      - name: Trigger production research
        shell: bash
        run: |
          set -euo pipefail
          BASE_URL="${ABSURDITY_URL%/}"

          request() {
            # --fail suppresses transient error bodies so retries cannot
            # concatenate multiple JSON documents into RESPONSE.
            curl --fail --silent --show-error \
              --retry 3 --retry-all-errors --retry-delay 5 \
              --max-time 90 "$@"
          }

          RESPONSE="$(request -X POST "$BASE_URL/api/research")"
          RUN_ID="$(RESPONSE="$RESPONSE" python3 -c 'import json,os; x=json.loads(os.environ["RESPONSE"]); assert x.get("run",{}).get("id"); print(x["run"]["id"])')"
          STATUS="$(RESPONSE="$RESPONSE" python3 -c 'import json,os; print(json.loads(os.environ["RESPONSE"]).get("run",{}).get("status",""))')"

          echo "Research run: $RUN_ID"
          echo "Initial status: $STATUS"

          if [ "$STATUS" = "complete" ]; then
            exit 0
          fi
          if [ "$STATUS" = "failed" ]; then
            echo "Research was already in a failed terminal state."
            exit 1
          fi
          if [ "$STATUS" != "running" ]; then
            echo "Unexpected research status: $STATUS"
            exit 1
          fi

          for attempt in {1..120}; do
            sleep 10
            RESPONSE="$(request "$BASE_URL/api/research?id=$RUN_ID")"
            STATUS="$(RESPONSE="$RESPONSE" python3 -c 'import json,os; print(json.loads(os.environ["RESPONSE"]).get("run",{}).get("status",""))')"

            if [ "$STATUS" = "complete" ]; then
              SELECTED="$(RESPONSE="$RESPONSE" python3 -c 'import json,os; print(json.loads(os.environ["RESPONSE"]).get("run",{}).get("selected",0))')"
              echo "Research completed; selected $SELECTED story/stories."
              exit 0
            fi
            if [ "$STATUS" = "failed" ]; then
              echo "Research run failed."
              exit 1
            fi
            if [ "$STATUS" != "running" ]; then
              echo "Unexpected research status: $STATUS"
              exit 1
            fi
          done

          echo "Research did not reach a terminal state within 20 minutes."
          exit 1
