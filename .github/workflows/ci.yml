name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install
        run: npm ci
      - name: Regression tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Boot and smoke test
        shell: bash
        run: |
          ABSURDITY_MODE=demo npm start > /tmp/absurdity-next.log 2>&1 &
          APP_PID=$!
          trap "kill $APP_PID || true" EXIT

          READY=0
          for i in {1..20}; do
            if curl --silent --fail http://127.0.0.1:3000 > /tmp/home.html; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/absurdity-next.log
            exit 1
          fi

          test -s /tmp/home.html

          curl --silent --fail http://127.0.0.1:3000/api/live > /tmp/live.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/live.json","utf8")); if(x.status!=="ok" || x.service!=="absurdity") process.exit(1);'

          curl --silent --fail "http://127.0.0.1:3000/api/stories?scope=home" > /tmp/home-stories.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/home-stories.json","utf8")); if(x.mode!=="demo" || !Array.isArray(x.stories) || x.stories.length===0) process.exit(1);'

          curl --silent --fail \
            -X POST http://127.0.0.1:3000/api/chat \
            -H "Content-Type: application/json" \
            -d '{"message":"Anything from Africa?"}' \
            > /tmp/chat.json

          cat /tmp/chat.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/chat.json","utf8")); if(!x.text || !x.text.includes("South Africa")) process.exit(1);'
