name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
      - name: Boot and smoke test
        shell: bash
        run: |
          npm start > /tmp/absurdity-next.log 2>&1 &
          APP_PID=$!
          trap "kill $APP_PID || true" EXIT

          READY=0
          for i in {1..20}; do
            if curl --silent --fail http://127.0.0.1:3000 > /tmp/home.html; then
              READY=1
              break
            fi
            sleep 1
          done

          if [ "$READY" -ne 1 ]; then
            cat /tmp/absurdity-next.log
            exit 1
          fi

          test -s /tmp/home.html

          curl --silent --fail             -X POST http://127.0.0.1:3000/api/chat             -H "Content-Type: application/json"             -d '{"message":"Anything from Africa?"}'             > /tmp/chat.json

          cat /tmp/chat.json
          node -e 'const fs=require("fs"); const x=JSON.parse(fs.readFileSync("/tmp/chat.json","utf8")); if(!x.text || !x.text.includes("South Africa") && x.storyId === "goat-council") process.exit(1);'
