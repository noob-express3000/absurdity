services:
  - type: web
    name: absurdity
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: ABSURDITY_MODE
        value: live
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: RESEARCH_WINDOW_HOURS
        value: "30"
      - key: RESEARCH_MAX_CANDIDATES
        value: "12"
