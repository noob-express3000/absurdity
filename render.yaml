services:
  - type: web
    name: absurdity
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run db:check && npm start
    healthCheckPath: /api/live
    autoDeployTrigger: checksPass
    envVars:
      - key: ABSURDITY_MODE
        value: live
      - key: ABSURDITY_REQUIRE_TURSO
        value: "true"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: ELEVENLABS_VOICE_ID
        sync: false
      - key: EXA_API_KEY
        sync: false
      - key: TAVILY_API_KEY
        sync: false
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: RESEARCH_WINDOW_HOURS
        value: "48"
      - key: RESEARCH_MAX_CANDIDATES
        value: "18"
      - key: EXA_DISCOVERY_RESULTS_PER_QUERY
        value: "8"
